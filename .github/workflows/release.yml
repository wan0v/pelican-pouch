name: Release

on:
    push:
        tags: ['v*']

permissions:
    contents: write
    packages: write

jobs:
    agent:
        name: Agent image
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - name: Derive version
              id: version
              run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push
              uses: docker/build-push-action@v6
              with:
                  context: agent
                  push: true
                  build-args: |
                      AGENT_VERSION=${{ steps.version.outputs.value }}
                  tags: |
                      ghcr.io/wan0v/pouch-agent:${{ steps.version.outputs.value }}
                      ghcr.io/wan0v/pouch-agent:latest
                  # Links the GHCR package to this repository.
                  labels: |
                      org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
                      org.opencontainers.image.version=${{ steps.version.outputs.value }}

    plugin:
        name: Plugin zip
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  extensions: zip
                  coverage: none

            - name: Derive version
              id: version
              run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

            # The tag is the single source of truth for the version: it lands in
            # plugin.json, in the zip name and in the agent image tag.
            - name: Build zip
              run: php scripts/build-zip.php "${{ steps.version.outputs.value }}"

            - name: Create release
              uses: softprops/action-gh-release@v2
              with:
                  files: dist/pouch-${{ steps.version.outputs.value }}.zip
                  generate_release_notes: true

    manifest:
        name: Update manifest
        needs: plugin
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: main

            - name: Derive version
              id: version
              run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

            # plugin.json points update_url at this file. The panel reads
            # { "*": { version, download_url } } - see Plugin::getUpdateData().
            - name: Write update.json
              env:
                  VERSION: ${{ steps.version.outputs.value }}
                  REPO: ${{ github.repository }}
                  SERVER: ${{ github.server_url }}
              run: |
                  php -r '
                      $version = getenv("VERSION");
                      $url = sprintf(
                          "%s/%s/releases/download/v%s/pouch-%s.zip",
                          getenv("SERVER"), getenv("REPO"), $version, $version,
                      );
                      file_put_contents("update.json", json_encode(
                          ["*" => ["version" => $version, "download_url" => $url]],
                          JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES,
                      ) . "\n");
                  '
                  cat update.json

            - name: Commit
              run: |
                  set -euo pipefail
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  if git diff --quiet update.json; then
                      echo "update.json already current"
                      exit 0
                  fi
                  git add update.json
                  git commit -m "chore: point update.json at v${{ steps.version.outputs.value }} [skip ci]"
                  git push origin main
