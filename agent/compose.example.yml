# Pelican Pouch Agent
#
# Run this on the *node*, not on the panel host.
# See README.md for the differences between the three modes.

services:
    pouch-agent:
        image: ghcr.io/wan0v/pouch-agent:latest
        container_name: pelican-pouch
        restart: always

        # standalone / frontend: the agent has to own ports 80 and 443 of the
        # node and must reach the server allocations on their node-internal IPs.
        # Host networking is the simplest way to get both.
        network_mode: host

        # Credentials, generated on the node's Pouch tab in the panel:
        #   POUCH_PANEL_URL, POUCH_TOKEN_ID, POUCH_TOKEN
        # Keep them in a separate file (chmod 600) so they stay out of
        # `docker inspect` and out of any copy of this compose file.
        env_file:
            - ./pouch.env

        environment:
            # standalone | frontend | behind
            POUCH_MODE: standalone

            POUCH_HTTP_PORT: 80
            POUCH_HTTPS_PORT: 443

            # Only used in "behind" mode: the local address to bind and the
            # networks whose X-Forwarded-* headers may be trusted. Defaults to
            # loopback, which is right when the front-end proxy runs here too.
            # POUCH_BIND: 10.0.0.2
            # POUCH_TRUSTED_PROXIES: 10.0.0.0/24

            # Poll interval in seconds.
            POUCH_INTERVAL: 15

            # Only used in "frontend" mode. Defaults to 127.0.0.1:<daemon_listen>.
            # POUCH_WINGS_UPSTREAM: 127.0.0.1:8080

            # Point this at a CA bundle if the panel uses a private or
            # self-signed certificate. Certificate verification is never
            # disabled: this channel carries the token and returns the
            # configuration the agent applies unverified.
            # POUCH_CA_CERT: /etc/pouch/panel-ca.crt

        volumes:
            # Certificate store. Persist this or every restart re-requests
            # certificates and you will run into ACME rate limits.
            - caddy_data:/data

            # Only needed with POUCH_CA_CERT.
            # - ./panel-ca.crt:/etc/pouch/panel-ca.crt:ro

volumes:
    caddy_data:
        driver: local
